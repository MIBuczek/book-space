name: CI

# Gate for every pull request: lint, unit test and build must all pass before a
# pull request can be merged. Branch protection on `main` requires the single
# `CI` check produced by the `gate` job below.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

# A new push to a pull request cancels the run already in flight, so the status
# reflects the latest commit only.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Nx Cloud is configured with a read-write token committed in nx.json. Never
  # use it from CI: a read-write token in a public repository lets anyone poison
  # the cache. Runs here are local-only.
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nx needs the merge base to compute affected projects
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Lint all projects
        run: yarn nx run-many --target=lint --all

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive

      # The integration suite starts a real `mongod` (mongodb-memory-server).
      # Without a cache the ~220 MB binary is downloaded on every run, which is
      # both slow and a new way for CI to fail for reasons unrelated to a change.
      # The key carries the pinned version so a bump re-downloads exactly once.
      - name: Cache the mongod binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-8.2.6-${{ runner.os }}

      # The binary lands in the default ~/.cache/mongodb-binaries, which is the
      # path cached above. Setting MONGOMS_DOWNLOAD_DIR here would not help: a
      # `~` in an `env:` value is passed through literally rather than expanded.
      - name: Run unit tests
        run: yarn nx run-many --target=test --projects=server,ui --configuration=ci

      # The threshold makes the build fail; this makes the number visible. The
      # original defect was that the reported figure (63.9%) was not the figure
      # being measured (42.5%), so print what the thresholds were checked
      # against rather than leaving it in a scrollback.
      - name: Report coverage
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const projects = [["server", "coverage/apps/server/coverage-summary.json"],
                              ["ui", "coverage/apps/ui/coverage-summary.json"]];
            const keys = ["statements", "branches", "functions", "lines"];
            const rows = [];
            for (const [name, path] of projects) {
              if (!fs.existsSync(path)) { rows.push([name, "no summary", "", "", ""]); continue; }
              const total = JSON.parse(fs.readFileSync(path, "utf8")).total;
              rows.push([name, ...keys.map((k) => total[k].pct + "%")]);
            }
            const header = ["project", ...keys];
            const widths = header.map((h, i) => Math.max(h.length, ...rows.map((r) => String(r[i]).length)));
            const line = (cells) => cells.map((c, i) => String(c).padEnd(widths[i])).join("  ");
            console.log(line(header));
            console.log(widths.map((w) => "-".repeat(w)).join("  "));
            for (const r of rows) console.log(line(r));
          '

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Build server and ui
        run: yarn nx run-many --target=build --projects=server,ui --configuration=production
      - name: Verify the built artefacts exist
        run: |
          test -f dist/apps/server/main.js || { echo "server bundle missing"; exit 1; }
          test -f dist/apps/ui/index.html || { echo "ui bundle missing"; exit 1; }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Build ui for scanning
        run: yarn nx build ui --configuration=production
      - name: Fail if a credential reached the client bundle
        run: |
          pattern='mongodb\+srv|AIza[0-9A-Za-z_-]{35}|service_[a-z0-9]{7}|JWT_SECRET|accessToken'
          if grep -rInE "$pattern" dist/apps/ui; then
            echo "::error::A credential or service identifier was found in the built client assets."
            exit 1
          fi
          echo "No credential found in dist/apps/ui."
      # The client-bundle scan above cannot see a committed .env, which is exactly
      # how a live MongoDB password and JWT secret leaked into this repo's history.
      - name: Fail if a credential is committed to the working tree
        run: |
          if git ls-files --error-unmatch apps/server/.env >/dev/null 2>&1; then
            echo "::error::apps/server/.env is tracked. It must never be committed."
            exit 1
          fi
          node tools/scan-secrets.js

  # Single required check for branch protection. It fails unless every job above
  # succeeded, which keeps the ruleset stable when jobs are added or renamed.
  gate:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, build, secrets]
    steps:
      - name: Check every job succeeded
        env:
          # Order follows the `needs` list above. Requiring an exact match means a
          # skipped job also fails the gate, which a `contains(..., 'failure')`
          # check would miss.
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "results: $RESULTS"
          if [ "$RESULTS" != "success,success,success,success" ]; then
            echo "::error::One or more required jobs did not succeed."
            exit 1
          fi
          echo "All required jobs succeeded."
